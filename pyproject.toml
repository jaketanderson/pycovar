[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pycovar"
version = "0.1.0"
description = "4D covariance NMR spectra from pairs of 3D NMRPipe spectra"
requires-python = ">=3.9"
dependencies = ["nmrglue", "numpy", "scipy", "tqdm"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pycovar = "pycovar.cli:main"

[tool.setuptools]
packages = ["pycovar"]
